<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360, height=560">
<meta name="color-scheme" content="dark light">
<title>Zatvor</title>
<!--
  Static copy of the approved "Main" popup mockup (stage 0b), for the stage 0c
  tray prototypes (proto/ui/tauri, proto/ui/wails). Colours are tokens; the light
  set is taken from the TrayLight mockup. Onest is bundled (fonts/, SIL OFL 1.1),
  no network requests. Host-specific code (paint probe) is injected by the host.
-->
<style>
@font-face{font-family:Onest;font-style:normal;font-display:block;font-weight:100 900;
  src:url(fonts/onest-cyrillic-wght-normal.woff2) format("woff2");
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-style:normal;font-display:block;font-weight:100 900;
  src:url(fonts/onest-latin-wght-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--page:#0B111B;--surface:#121B28;--text:#E7EEF7;--line:#263449;--frame:#263449;--card:#182434;
  --row:#1F2C3D;--muted:#95A5BB;--accent:#9DB4FF;--accent-hover:#C3D1FF;--ok:#5EDC9F;--blade:#2E4A43;
  --iris-bg:#0E1520;--knob:#0E1520}
@media (prefers-color-scheme: light){
  :root{--page:#E9EDF3;--surface:#FFFFFF;--text:#111A27;--line:#E2E7EE;--frame:#D5DCE6;--card:#F4F6FA;
    --row:#E8ECF2;--muted:#536176;--accent:#3D5BD9;--accent-hover:#2B44AE;--ok:#1F8A5B;--blade:#B9D9C8;
    --iris-bg:#F1F5F3;--knob:#FFFFFF}
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface);-webkit-user-select:none;user-select:none;cursor:default}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div style="width: 100vw; height: 100vh; box-sizing: border-box; background: var(--surface); color: var(--text); font-family: Onest, system-ui, sans-serif; font-size: 13px; line-height: 1.45; border: 1px solid var(--frame); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0 16px">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" style="stroke:var(--accent)" stroke-width="1.6"></circle><path d="M12.0 2.0L21.2 15.9M20.7 7.0L13.2 21.9M20.7 17.0L4.0 18.0M12.0 22.0L2.8 8.1M3.3 17.0L10.8 2.1M3.3 7.0L20.0 6.0" style="stroke:var(--accent)" stroke-width="1.3" fill="none"></path></svg>
<span style="font-weight: 600; font-size: 14px; letter-spacing: 0.01em">Zatvor</span>
</div>
<div style="display: flex; gap: 2px">
<button aria-label="Открыть панель" style="width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; display: grid; place-items: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></button>
<button aria-label="Ещё" style="width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; display: grid; place-items: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
</div>

<div style="display: flex; align-items: center; gap: 18px; padding: 18px 20px 16px 20px">
<div style="position: relative; width: 112px; height: 112px; flex: none">
<svg width="112" height="112" viewBox="0 0 128 128" role="img" aria-label="Затвор открыт: защита включена">
<defs><clipPath id="ap1"><circle cx="64" cy="64" r="56"></circle></clipPath></defs>
<circle cx="64" cy="64" r="56" style="fill:var(--iris-bg)"></circle>
<g clip-path="url(#ap1)"><path d="M64.0 8.0L114.7 87.9M112.5 36.0L68.7 119.8M112.5 92.0L18.0 95.9M64.0 120.0L13.3 40.1M15.5 92.0L59.3 8.2M15.5 36.0L110.0 32.1" style="stroke:var(--blade)" stroke-width="1.4" fill="none"></path></g>
<circle cx="64" cy="64" r="56" fill="none" style="stroke:var(--ok)" stroke-width="2.5"></circle>
<circle cx="64" cy="64" r="61.5" fill="none" style="stroke:var(--ok)" stroke-opacity="0.25" stroke-width="1"></circle>
</svg>
<div style="position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 26px; letter-spacing: 0.04em; color: var(--text)">NL</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="display: flex; align-items: center; gap: 6px; color: var(--ok); font-weight: 600"><svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" style="fill:var(--ok)"></circle></svg>Защита включена</div>
<div style="font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em">185.12.40.17</div>
<div style="color: var(--muted)">Нидерланды, Амстердам</div>
<div style="color: var(--muted)">IPv6 нет, DNS через туннель</div>
</div>
</div>

<div style="margin: 0 16px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="min-width: 0">
<div style="font-weight: 600">Hysteria2-DNS, Амстердам</div>
<div style="color: var(--muted); font-variant-numeric: tabular-nums">12 ч 40 мин, ↓ 3,2 МБ/с, ↑ 410 КБ/с</div>
</div>
<button aria-pressed="true" aria-label="Туннель включён" style="flex: none; width: 52px; height: 30px; border-radius: 15px; border: 0; background: var(--ok); position: relative; cursor: pointer"><span style="position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 12px; background: var(--knob)"></span></button>
</div>

<div style="padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 2px; flex: 1">
<div style="color: var(--muted); padding: 0 4px 6px 4px">Под защитой: только через туннель Zatvor</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; border-top: 1px solid var(--row)"><span>Claude</span><span style="color: var(--ok)">работает</span></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; border-top: 1px solid var(--row)"><span>Claude Code</span><span style="color: var(--ok)">работает, 3 процесса</span></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; border-top: 1px solid var(--row)"><span>Codex</span><span style="color: var(--muted)">не запущен</span></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; border-top: 1px solid var(--row)"><span>Cursor</span><span style="color: var(--muted)">не запущен</span></div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line)">
<button style="height: 48px; border: 0; background: transparent; color: var(--text); font: inherit; cursor: pointer">Пауза</button>
<button style="height: 48px; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; cursor: pointer">Проверить</button>
<button style="height: 48px; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; cursor: pointer">Панель</button>
</div>
</div>
</body>
</html>
