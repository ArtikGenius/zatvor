name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  xray-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            exe: xray
          - os: windows-latest
            platform: windows-amd64
            exe: xray.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./tools/xrayfetch -platform ${{ matrix.platform }} -dest third_party/xray/bin/${{ matrix.platform }}
      - run: echo "ZATVOR_XRAY=$GITHUB_WORKSPACE/third_party/xray/bin/${{ matrix.platform }}/${{ matrix.exe }}" >> "$GITHUB_ENV"
      - run: go vet -tags xrayint ./...
      - run: go test -tags xrayint -v ./internal/xrayint/... ./internal/geo/merge/... ./internal/validate/... ./internal/xrayrun/... ./internal/e2e/...

  systemtest-windows:
    # Live system tests: they really change the host, so they run only on
    # disposable GitHub runners. systest.Main refuses unless CI=true (set by
    # Actions) and ZATVOR_ALLOW_LIVE=1 (set here). The ubuntu entry runs only
    # the gate tests, which change nothing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkgs: ./internal/systest/... ./internal/proc/freeze/... ./internal/sysproxy/...
          - os: ubuntu-latest
            pkgs: ./internal/systest/...
    runs-on: ${{ matrix.os }}
    env:
      ZATVOR_ALLOW_LIVE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet -tags systemtest ./...
      - run: go test -tags systemtest -v ${{ matrix.pkgs }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./tools/secretscan .
